name = "fayzar-ocr-proxy"
main = "index.js"
compatibility_date = "2026-09-01"

# KV: API_KEYS (JSON array) ও KEY_LEDGER (Worker নিজেই লেখে)
# id বসানোর নিয়ম README.md-তে দেওয়া আছে।
[[kv_namespaces]]
binding = "FAYZAR_OCR_KEYS"
id = "2de59ce830064432b4e8938373ebc2bf"

[vars]
ALLOWED_ORIGINS = "https://fayzar-conveter.pages.dev, https://*.fayzar-conveter.pages.dev, http://localhost:3008, http://127.0.0.1:3008"
RATE_PER_MIN = "40"

# part-4: ব্রাউজার ছাড়া সরাসরি কল বন্ধ (স্ক্রিপ্ট-অপব্যবহার রোধ)
# note: পুরোনো ডোমেইন (fayzarcomputer.com.bd) আর ব্যবহার না হওয়ায় allowlist থেকে সরানো হলো
REQUIRE_ORIGIN = "true"

# part-4: প্রতি IP-তে দৈনিক OCR সীমা (শেয়ার্ড NAT-এ ইচ্ছেমতো বাড়ান)
DAILY_PER_IP = "500"
